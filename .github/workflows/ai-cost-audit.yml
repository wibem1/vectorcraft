name: AI cost audit tests
on:
  push:
    branches: [feature/cost-aware-ai-integration]
  pull_request:
    paths:
      - 'Tools/cost_audit.py'
      - 'Tools/test_cost_audit.py'
      - 'Tools/ai_client_cost_policy.py'
      - 'Tools/test_ai_client_cost_policy.py'
      - 'Tools/vectorcraft_local_bridge.py'
      - 'Tools/test_vectorcraft_local_bridge.py'
      - 'docs/AI-COST-ARCHITECTURE.md'
      - '.github/workflows/ai-cost-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test offline diagnostic cost calculations
        run: python3 -m unittest discover -s Tools -p 'test_*.py' -v
