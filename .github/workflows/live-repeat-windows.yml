name: Live Repeat Windows Test
on:
  push:
    branches: [live-repeat-editing]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-repeat-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 1
  RUST_TEST_THREADS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_CODEGEN_UNITS: 1
  CARGO_PROFILE_TEST_CODEGEN_UNITS: 1
  VECTORCRAFT_BUILD_SHA: ${{ github.sha }}
  VECTORCRAFT_VERSION: 0.11.0-live-repeat.1
jobs:
  verify:
    if: github.ref == 'refs/heads/live-repeat-editing'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: All quality gates
        env:
          RUST_MIN_STACK: 33554432
        run: cargo xtask ci
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: live-repeat-windows
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Set distinct test version
        run: cargo xtask version set "$env:VECTORCRAFT_VERSION"
      - name: Build portable test app
        run: |
          cargo build --locked -p vectorcraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist/LiveRepeat -Force | Out-Null
          Copy-Item target/debug/vectorcraft.exe dist/LiveRepeat/VectorCraft-LiveRepeat.exe
          Copy-Item packaging/windows/live-repeat/* dist/LiveRepeat/
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE dist/LiveRepeat/
          "Version: $env:VECTORCRAFT_VERSION`nProfile: optimized test app (workspace opt-level 1, dependencies opt-level 2, debug info off)`nCommit: $env:GITHUB_SHA`nBuild: $(Get-Date -Format o)" | Set-Content dist/LiveRepeat/BUILD.txt
      - name: Native startup and repeat smoke test
        run: ./packaging/windows/live-repeat/Smoke.ps1 -Exe "$PWD/dist/LiveRepeat/VectorCraft-LiveRepeat.exe" -Output "$PWD/dist/smoke"
      - name: Windows engine and native tests
        env:
          RUST_MIN_STACK: 33554432
        run: |
          cargo test --locked -p vectorcraft-engine -p vectorcraft-ui-egui -p vectorcraft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package verified build
        run: |
          Remove-Item dist/LiveRepeat/Smoke.ps1
          Copy-Item dist/smoke/report.json dist/LiveRepeat/SELFTEST.json
          Compress-Archive -Path dist/LiveRepeat/* -DestinationPath dist/VectorCraft-LiveRepeat-Windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-repeat-windows-candidate
          path: dist/VectorCraft-LiveRepeat-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: live-repeat-windows-evidence
          path: dist/smoke
  package:
    needs: [verify, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: live-repeat-windows-candidate
          path: dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: VectorCraft-LiveRepeat-Windows-x64
          path: dist/VectorCraft-LiveRepeat-Windows-x64.zip
          if-no-files-found: error
