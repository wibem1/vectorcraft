name: VectorCraft Chat real headless engine
on:
  workflow_dispatch:
  push:
    paths:
      - 'vectorcraft-chat/**'
      - '.github/workflows/vectorcraft-chat-headless.yml'
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Compile actual VectorCraft MCP CLI
        run: cargo build --locked --release -p vectorcraft-cli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chat regression tests
        run: PYTHONPATH=vectorcraft-chat python -m unittest discover -s vectorcraft-chat/tests -v
      - name: Real engine exact geometry and interactive follow-up edits
        timeout-minutes: 3
        run: python vectorcraft-chat/tests/smoke_headless.py target/release/vectorcraft-cli
      - name: Tk chat callbacks with actual engine (virtual display)
        timeout-minutes: 3
        env:
          PYTHONPATH: vectorcraft-chat
          VC_CHAT_REAL_CLI: target/release/vectorcraft-cli
        run: xvfb-run -a python -m unittest discover -s vectorcraft-chat/tests -p test_ui_real_engine.py -v
      - name: Preserve real engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-chat-engine-evidence
          path: |
            headless-report.json
            headless-triangle.png
          if-no-files-found: warn
