name: VectorCraft Chat real headless engine
on:
  workflow_dispatch:
  push:
    paths:
      - 'vectorcraft-chat/*.py'
      - 'vectorcraft-chat/tests/**'
      - '.github/workflows/vectorcraft-chat-headless.yml'
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Native GUI dependencies and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1 mesa-vulkan-drivers xvfb xauth imagemagick
      - name: Compile actual native VectorCraft and MCP CLI
        run: cargo build --locked --release -p vectorcraft -p vectorcraft-cli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chat regression tests
        run: PYTHONPATH=vectorcraft-chat python -m unittest discover -s vectorcraft-chat/tests -v
      - name: Real engine exact geometry and interactive follow-up edits
        timeout-minutes: 3
        run: python vectorcraft-chat/tests/smoke_headless.py target/release/vectorcraft-cli
      - name: Tk chat callbacks with actual engine (virtual display)
        timeout-minutes: 3
        env:
          PYTHONPATH: vectorcraft-chat
          VC_CHAT_REAL_CLI: target/release/vectorcraft-cli
        run: xvfb-run -a python -m unittest discover -s vectorcraft-chat/tests -p test_ui_real_engine.py -v
      - name: GPU and renderer environment diagnostics
        if: always()
        continue-on-error: true
        run: |
          echo "DISPLAY=${DISPLAY:-unset}"
          echo "Available Vulkan drivers:"
          ls -l /usr/share/vulkan/icd.d/ || true
          echo "GL library:"
          ldconfig -p | grep -E 'lib(EGL|GLX|vulkan)\\.so' || true
          echo "Native executable dependencies:"
          ldd target/release/vectorcraft || true
          echo "Native launch diagnostics will retain stderr in uploaded artifacts."
      - name: Native renderer diagnostic (OpenGL via software Mesa)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        env:
          PYTHONPATH: vectorcraft-chat
          VC_CHAT_NATIVE_APP: target/release/vectorcraft
          LIBGL_ALWAYS_SOFTWARE: '1'
          WGPU_BACKEND: gl
          RUST_BACKTRACE: '1'
          RUST_LOG: info
        run: xvfb-run -a python -m unittest discover -s vectorcraft-chat/tests -p test_native_startup.py -v
      - name: Chat starts actual native VectorCraft and edits through real TCP/MCP
        timeout-minutes: 4
        env:
          PYTHONPATH: vectorcraft-chat
          VC_CHAT_NATIVE_APP: target/release/vectorcraft
          LIBGL_ALWAYS_SOFTWARE: '1'
          WGPU_BACKEND: vulkan
          RUST_BACKTRACE: '1'
          RUST_LOG: info
        run: xvfb-run -a python -m unittest discover -s vectorcraft-chat/tests -p test_native_startup.py -v
      - name: Preserve real engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-chat-engine-evidence
          path: |
            headless-report.json
            headless-triangle.png
            native-startup-report.json
            native-chat.png
            native-startup.log
          if-no-files-found: warn
