name: VectorCraft Chat actual native key stores
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vectorcraft-chat-keystores.yml'
permissions:
  contents: read
jobs:
  keys:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual store, read, update and delete; no login keychain
        run: |
          python -c "import sys; sys.path.insert(0,'vectorcraft-chat'); sys.path.insert(0,'vectorcraft-chat/tests'); exec('''
          import json, tempfile, uuid
          from pathlib import Path
          from unittest.mock import patch
          import vectorcraft_chat as app
          from test_native_startup import isolated_keychain
          with tempfile.TemporaryDirectory() as directory:
              base=Path(directory)
              with isolated_keychain(base), patch.object(app,'APP_DIR',base), patch.object(app,'KEY_FILE',base/'secret'):
                  first='dummy-ci-'+uuid.uuid4().hex
                  app.save_secret(first)
                  assert app.load_secret()==first, 'Stored key did not roundtrip'
                  if sys.platform=='win32':
                      assert first.encode() not in app.KEY_FILE.read_bytes(), 'DPAPI file contains plaintext'
                  app.save_secret(first+'-updated')
                  assert app.load_secret()==first+'-updated', 'Key update failed'
                  app.save_secret('')
                  assert app.load_secret()=='', 'Key deletion failed'
          report={'status':'PASS','platform':sys.platform,'backend':'DPAPI' if sys.platform=='win32' else 'isolated actual macOS Keychain','operations':['store','read','update','delete'],'login_keychain_used':False}
          Path('native-key-store-report.json').write_text(json.dumps(report,indent=2))
          print('PASS native key store: '+report['backend']+' store/read/update/delete')
          ''')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vectorcraft-chat-key-store-${{ matrix.os }}
          path: native-key-store-report.json
          if-no-files-found: warn
