# VCCHAT.55: revalidate corrected completion pipeline after Actions re-enabled, 2026-10-23.
name: VectorCraft Chat frozen candidates with real engine
on:
  workflow_dispatch:
  push:
    paths:
      - 'vectorcraft-chat/*.py'
      - 'vectorcraft-chat/packaging/**'
      - 'vectorcraft-chat/tests/**'
      - '.github/workflows/vectorcraft-chat-packages.yml'
permissions:
  contents: read
concurrency:
  group: vectorcraft-chat-candidates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  superseded:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older candidate variants for this same branch only
        uses: actions/github-script@v7
        with:
          script: |
            const current = (await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            })).data;
            for (const status of ['queued', 'in_progress']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id: 'vectorcraft-chat-packages.yml',
                branch: current.head_branch, status, per_page: 100
              });
              for (const run of runs) {
                if (run.run_number >= current.run_number) continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                  core.info(`Cancelled superseded candidate run ${run.id}`);
                } catch (error) {
                  if (error.status !== 409) throw error;
                }
              }
            }
  native:
    needs: superseded
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyInstaller==6.22.3 Pillow
      - name: Fingerprint exact native source and runner image
        id: native-source
        run: python vectorcraft-chat/packaging/engine_cache.py fingerprint
      - uses: actions/cache/restore@v4
        id: native-binaries
        with:
          path: native-cache
          key: chat-native-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-source.outputs.fingerprint }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.native-binaries.outputs.cache-hit != 'true'
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        if: steps.native-binaries.outputs.cache-hit != 'true'
        with:
          key: native-chat-platform-v1
          cache-on-failure: true
          cache-workspace-crates: true
      - run: cargo build --locked --release -p vectorcraft -p vectorcraft-cli
        if: steps.native-binaries.outputs.cache-hit != 'true'
      - name: Record actual compiled binaries before package diagnostics
        if: steps.native-binaries.outputs.cache-hit != 'true'
        run: python vectorcraft-chat/packaging/engine_cache.py save
      - uses: actions/cache/save@v4
        if: steps.native-binaries.outputs.cache-hit != 'true'
        with:
          path: native-cache
          key: ${{ steps.native-binaries.outputs.cache-primary-key }}
      - name: Verify exact native binary digests and prepare package
        run: python vectorcraft-chat/packaging/engine_cache.py restore
      - name: Build and execute frozen app against bundled actual engine
        run: python vectorcraft-chat/packaging/build_candidate.py
      - name: Preserve packaged execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-evidence-${{ matrix.os }}
          path: packaged-evidence/
          if-no-files-found: warn
      - name: Tested candidate only, no GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: tested-chat-candidate-${{ matrix.os }}
          path: candidate/*.zip
          if-no-files-found: error
